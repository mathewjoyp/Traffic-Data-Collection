name: Process Map and Update DB

on:
  schedule:
    # Cron syntax for "Every 15 minutes"
    - cron: '*/15 * * * *'
  
  # Allows you to run this manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your code so the runner can access it
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9' # Or whichever version you use

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Run the script and pass the secret
      - name: Run processing script
        env:
          # This maps the GitHub Secret to the Python OS Environment Variable
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: python main.py
